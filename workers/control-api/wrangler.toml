name = "mipede-control-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
MIPEDE_EMAIL_PASSWORD_AUTH_ENABLED = "0"
MIPEDE_GOOGLE_AUTH_ENABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "mipede-control-staging"
database_id = "826e13c2-03c4-4331-9608-fc9b2c79cd01"
migrations_dir = "migrations"

[[d1_databases]]
binding = "APP_DB"
database_name = "mipede-app-staging"
database_id = "c7f419a9-0d7a-4fac-acd0-445d15ac571b"
migrations_dir = "migrations-app"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mipede-media-staging"

[env.staging]
name = "mipede-control-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
BETTER_AUTH_URL = "https://mipede-web.vercel.app"
APP_PUBLIC_URL = "https://mipede-web.vercel.app"
MIPEDE_EMAIL_PASSWORD_AUTH_ENABLED = "0"
MIPEDE_GOOGLE_AUTH_ENABLED = "1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mipede-control-staging"
database_id = "826e13c2-03c4-4331-9608-fc9b2c79cd01"
migrations_dir = "migrations"

[[env.staging.d1_databases]]
binding = "APP_DB"
database_name = "mipede-app-staging"
database_id = "c7f419a9-0d7a-4fac-acd0-445d15ac571b"
migrations_dir = "migrations-app"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "mipede-media-staging"

[env.production]
name = "mipede-control-api"

[env.production.vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://mipede-web.vercel.app"
APP_PUBLIC_URL = "https://mipede-web.vercel.app"
MIPEDE_EMAIL_PASSWORD_AUTH_ENABLED = "0"
MIPEDE_GOOGLE_AUTH_ENABLED = "1"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mipede-control-production"
database_id = "ff783a90-3443-443f-bbd2-5ac7a184331b"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "APP_DB"
database_name = "mipede-app-production"
database_id = "e1a2308c-ee52-4105-90a3-3725937869d4"
migrations_dir = "migrations-app"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "mipede-media-production"

# Secrets via wrangler secret put --env staging|production
# BETTER_AUTH_SECRET
# RESEND_API_KEY
# TURNSTILE_SECRET_KEY
# PLATFORM_ADMIN_EMAILS
# TRUSTED_ORIGINS
# MIPEDE_BFF_SHARED_SECRET
# RESEND_FROM_EMAIL
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# MIPEDE_PII_ENCRYPTION_KEY
# MIPEDE_EMAIL_LOOKUP_KEY
