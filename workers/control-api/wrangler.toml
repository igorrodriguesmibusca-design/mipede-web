name = "mipede-control-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "mipede-control"
database_id = "REPLACE_AFTER_PROVISIONING"

# Secrets (wrangler secret put) — nunca versionar valores:
# BETTER_AUTH_SECRET
# RESEND_API_KEY
# TURNSTILE_SECRET_KEY
# PLATFORM_ADMIN_EMAILS
# TRUSTED_ORIGINS
# BETTER_AUTH_URL
# RESEND_FROM_EMAIL
# ALLOW_TEST_EMAIL_BYPASS (somente local/teste)
